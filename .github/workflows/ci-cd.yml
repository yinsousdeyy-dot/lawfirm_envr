name: Ann & Associates Enterprise CI/CD Pipeline

on:
  pull_request:
    branches: [ "main", "staging" ]
  push:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ann_enterprise_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pipeline Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas psycopg2-binary pytest cryptography requests numpy scikit-learn

      - name: Run Automated ETL & Data Quality Pytest Suite
        run: |
          pytest automation/tests/test_etl_pipeline.py -v

  deploy-production:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Containers & Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="🚀 *CI/CD Production Deployment Complete*%0A*Commit:* \`${GITHUB_SHA::7}\`%0A*Tests:* \`100% Passed (Pytest)\`"