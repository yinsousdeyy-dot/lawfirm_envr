events {
    worker_connections 1024;
}

http {
    # Token Bucket Rate Limiting Zones
    # General web traffic: 10 requests/sec per IP with burst of 20
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    # Strict auth/API traffic: 2 requests/sec per IP with burst of 5
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name ann-associates.com academy.ann-associates.com;

        # Enforce HTTPS Redirect
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name ann-associates.com academy.ann-associates.com;

        # Security & HSTS Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Protect Admin & Login Endpoints
        location /login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://web-app:3000;
        }

        # Standard Portal & Academy Endpoints
        location / {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://web-app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /academy{
            ...
        }

    }
}